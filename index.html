<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V&M Vending</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #4a332a, #120c0a);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Montserrat', sans-serif;
  color: #f2d7a0;
}

/* MAIN FRAME */
.screen {
  width: 360px;
  height: 740px;
  border-radius: 28px;
  position: relative;
  background: rgba(20, 14, 12, 0.9);
  box-shadow:
    0 0 60px rgba(255, 200, 120, 0.25),
    inset 0 0 0 1px rgba(255, 215, 150, 0.25);
}

/* GOLD BORDER */
.screen::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 22px;
  border: 1px solid rgba(255, 215, 150, 0.35);
  pointer-events: none;
}

/* CONTENT */
.content {
  position: absolute;
  inset: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* LOGO */
.logo {
  font-size: 26px;
  margin-top: 10px;
}

.logo span {
  display: block;
  font-size: 14px;
  letter-spacing: 1px;
  opacity: 0.9;
}

/* TITLE */
.title {
  margin-top: 25px;
  font-family: 'Playfair Display', serif;
  font-size: 26px;
}

/* SCRATCH AREA */
.scratch-box {
  margin-top: 40px;
  width: 100%;
  height: 210px;
  border-radius: 20px;
  background: linear-gradient(145deg, #3b2a23, #1b1310);
  border: 1px solid rgba(255,215,150,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
}

.scratch-text {
  font-size: 20px;
  letter-spacing: 2px;
  opacity: 0.9;
}

/* FORTUNE */
.fortune {
  position: absolute;
  inset: 20px;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 22px;
}

/* CAMERA */
.camera {
  margin-top: 30px;
  text-align: center;
  font-size: 14px;
  opacity: 0.85;
}

/* SOCIALS */
.socials {
  margin-top: auto;
  text-align: center;
  font-size: 13px;
}

.socials span {
  margin: 0 6px;
  font-weight: 500;
}

/* FOOTER */
.footer {
  margin-top: 10px;
  font-size: 11px;
  opacity: 0.7;
  text-align: center;
}
</style>
</head>

<body>

<div class="screen">
  <div class="content">

    <div class="logo">☕ V&M Vending
      <span></span>
    </div>

    <div class="title">Твоят кафе-късмет ✨</div>

    <div class="scratch-box" onclick="drawFortune()">
      <div class="scratch-text">ИЗТЪРКАЙ ТУК ☕</div>
      <div class="fortune" id="fortune"></div>
    </div>

    <div class="camera">
      📸 Снимай своя момент<br>и ни отбележи!
    </div>

    <div class="socials">
      <span>Facebook</span> | <span>Viber</span>
    </div>

    <div class="footer">
      Проблем с машината? Пиши ни тук.<br>
      С любов от V&M VENDING
    </div>

  </div>
</div>

<script>
const fortunes = [
  "Днес късметът пие кафе с теб ☕",
  "Малка пауза, голяма усмивка ✨",
  "Нещо хубаво те чака съвсем скоро",
  "Това кафе беше точно навреме 🤎",
  "Днес ще се усмихнеш повече от обикновено"
];

function drawFortune() {
  const box = document.querySelector(".scratch-text");
  const fortune = document.getElementById("fortune");
  const random = Math.floor(Math.random() * fortunes.length);

  box.style.display = "none";
  fortune.style.display = "flex";
  fortune.innerText = fortunes[random];
}
</script>

</body>
</html>
