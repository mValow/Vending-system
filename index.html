<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V&M Vending - Твоят Късмет</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD39A;
            --coffee-dark: #21120d;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #4e342e 0%, #1a0f0c 100%);
            font-family: 'Montserrat', sans-serif;
            color: #f3e5f5; text-align: center;
            overflow-x: hidden;
        }

        /* Ефект на светлинни частици */
        body::before {
            content: "";
            position: absolute; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.2; pointer-events: none;
        }

        /* --- АНИМИРАНА ЧАШКА --- */
        .coffee-wrapper {
            margin: 20px auto 10px;
            position: relative;
            width: 80px; height: 80px;
            animation: cupFloat 3s ease-in-out infinite;
        }

        @keyframes cupFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .coffee-logo {
            position: absolute; bottom: 10px; left: 15px;
            width: 50px; height: 35px;
            background: var(--gold);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 211, 154, 0.4);
        }

        .coffee-logo::after {
            content: '';
            position: absolute; top: 5px; right: -12px;
            width: 12px; height: 18px;
            border: 4px solid var(--gold);
            border-radius: 50%;
        }

        .steam-container {
            position: absolute; top: 0px; left: 25px;
            display: flex; gap: 8px;
        }

        .steam {
            width: 4px; height: 25px;
            background: linear-gradient(to top, rgba(255,255,255,0.9), transparent);
            border-radius: 10px;
            filter: blur(1.5px);
            animation: steamRise 2s infinite ease-out;
            opacity: 0;
        }

        .steam:nth-child(2) { animation-delay: 0.4s; }
        .steam:nth-child(3) { animation-delay: 0.8s; }

        @keyframes steamRise {
            0% { transform: translateY(0) scaleX(1); opacity: 0; }
            30% { opacity: 0.7; }
            100% { transform: translateY(-45px) scaleX(2.5); opacity: 0; }
        }

        .container {
            background: rgba(43, 24, 16, 0.8);
            backdrop-filter: blur(15px);
            padding: 30px 20px;
            border-radius: 40px;
            width: 90%; max-width: 360px;
            border: 1px solid rgba(255, 211, 154, 0.25);
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
            position: relative;
            z-index: 5;
        }

        h1 { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.5rem; color: var(--gold); margin-bottom: 15px; }

        #scratch-container {
            position: relative; width: 280px; height: 180px;
            margin: 0 auto; border-radius: 20px; overflow: hidden;
            background: #fffcf2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #fortune-overlay {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1;
        }

        .watermark {
            position: absolute;
            font-size: 2.2rem;
            font-weight: 800;
            color: rgba(62, 39, 35, 0.04);
            transform: rotate(-15deg);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            font-family: 'Comfortaa';
        }

        #fortune-text { 
            color: #3e2723; font-weight: 600; font-size: 1.1rem; 
            padding: 0 25px; line-height: 1.4; position: relative; z-index: 2;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 3; touch-action: none; cursor: crosshair; }

        .test-btn {
            background: linear-gradient(135deg, rgba(255,211,154,0.2), rgba(255,211,154,0.1));
            border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 20px; border-radius: 25px;
            font-size: 0.8rem; cursor: pointer; transition: 0.3s; margin-top: 15px;
        }

        .music-control { 
            position: absolute; top: 20px; right: 20px; 
            background: rgba(255, 211, 154, 0.1); border: 1px solid var(--gold);
            color: var(--gold); border-radius: 50%; width: 35px; height: 35px; cursor: pointer;
        }

        .footer-text { margin-top: 15px; font-size: 0.7rem; color: #8d6e63; }
        .report-btn { display: inline-block; margin-top: 20px; color: #bcaaa4; font-size: 0.75rem; text-decoration: none; }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://www.mboxdrive.com/Massive%20x%20Touch%20Me.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <button class="music-control" onclick="toggleMusic()" id="musicBtn">🔇</button>
    
    <div class="coffee-wrapper">
        <div class="steam-container">
            <div class="steam"></div>
            <div class="steam"></div>
            <div class="steam"></div>
        </div>
        <div class="coffee-logo"></div>
    </div>
    
    <div style="font-family: 'Comfortaa'; letter-spacing: 3px; font-size: 0.7rem; color: #d7ccc8; text-transform: uppercase;">V&M Vending</div>
    
    <div id="scratch-area">
        <h1>Твоят кафе-късмет ✨</h1>
        <div id="scratch-container">
            <div class="watermark">V&M Vending</div>
            <div id="fortune-overlay">
                <div id="fortune-text"></div>
            </div>
            <canvas id="scratch-canvas" width="280" height="180"></canvas>
        </div>

        <div id="shareSection" style="display:none;">
            <button class="test-btn" onclick="initScratch()">🔄 НОВ КЪСМЕТ (ТЕСТ)</button>
        </div>
    </div>

    <div id="limit-message" style="display:none; padding: 20px;">
        <h2 style="color: var(--gold);">Един късмет на ден! 😊</h2>
        <p>Твоето кафе те очаква. Опитай пак утре!</p>
        <button class="test-btn" onclick="clearMemory()">🔓 ОТКЛЮЧИ ЗА ТЕСТ</button>
    </div>
    
    <a href="viber://add?number=359896746996" class="report-btn">Проблем с машината? Пиши ни тук.</a>
    <div class="footer-text">С любов от <strong>V&M VENDING</strong></div>
</div>

<script>
    const fortunes = [
        "Твоят потенциал е безкраен – започни днес!",
        "Всяко голямо пътуване започва с първата крачка.",
        "Днес е идеалният ден за ново начало.",
        "Ти си архитектът на своето щастие.",
        "Не спирай, докато не се гордееш със себе си.",
        "Твоята упоритост е ключът към успеха ти.",
        "Малките победи водят до големи триумфи.",
        "Бъди по-добра версия на себе си от вчера.",
        "Трудностите днес са силата ти утре.",
        "Вярвай в себе си, дори когато никой друг не вярва.",
        "Дисциплината е мостът между целите и постиженията.",
        "Провали се 7 пъти, изправи се 8.",
        "Днес ще направиш нещо, за което ще си благодариш утре.",
        "Успехът не е случайност, а избор.",
        "Мечтай смело и действай решително.",
        "Не чакай идеалния момент, направи го идеален.",
        "Твоята енергия е твоята визитна картичка.",
        "Една добра идея е само началото – реализирай я!",
        "Нищо не е невъзможно за този, който опитва.",
        "Фокусирай се върху прогреса, не върху съвършенството.",
        "Днес ще намериш решение на стар проблем.",
        "Ти си по-силен, отколкото предполагаш.",
        "Постави си високи цели и ги гони докрай.",
        "Всеки ден е шанс да промениш живота си.",
        "Твоят труд няма да остане незабелязан.",
        "Бъди смел – светът обича решителните.",
        "Вдъхновението идва при тези, които работят.",
        "Погледни нагоре – небето е границата.",
        "Днес е денят на голямата крачка напред.",
        "Успехът ти е въпрос на време.",
        "Днес ще имаш повече енергия от батерията на телефона си!",
        "Късметът те следи... скрий се, за да те намери!",
        "Ден без нито един „спешен“ имейл.",
        "Печелиш свободно място за паркиране точно пред входа.",
        "Днес кафето ще подейства преди третата чаша.",
        "Шопинг терапия, за която банковата ти сметка няма да разбере.",
        "Днес дори огледалото ще ти каже „Опаляяя!“.",
        "Ще намериш 20 лева в стар джоб.",
        "Днес никой няма да те ядоса (или поне ще се старае).",
        "Кантарът днес ще ти покаже цифра, която ти харесва.",
        "Прогнозата за днес: 100% шанс за усмивки.",
        "Очаква те ден, сладък като десерт без калории.",
        "Днес ще си толкова продуктивен, че ще се уплашиш.",
        "Батерията ти ще издържи до края на вечерта.",
        "Нито един червен светофар по пътя за работа.",
        "Днес е ден за мързел... ама от утре!",
        "Неочаквано намаление на нещо, което много искаш.",
        "Днес ще си звездата на всяка компания.",
        "Комплимент, който ще те държи цяла седмица.",
        "Малка печалба от лотарията или томбола.",
        "Днес всички вицове ще ти се струват смешни.",
        "Очаква те купон, за който ще се говори дълго.",
        "Днес ще разбереш някоя забавна тайна.",
        "Косата ти днес ще изглежда перфектно от първия път.",
        "Ще намериш зарядното си от първия път!",
        "Днес съдбата ти е „Unlimited“ – харчи я със здраве.",
        "Твоето ниво на готиност днес е извън скалата!",
        "Очаквай романтично обяснение в любов.",
        "Любовта е по-близо, отколкото си мислиш.",
        "Вечеря на свещи и дълги разговори.",
        "Някой тайно се възхищава на твоята усмивка.",
        "Твоята половинка ще те изненада приятно.",
        "Време е да отвориш сърцето си за новото.",
        "Едно съобщение ще разтопи сърцето ти.",
        "Стара любов ще ти напомни за себе си с добро.",
        "Нов флирт, който ще ти даде крила.",
        "Очаква те нежност, която ще те сгрее.",
        "Днес е идеалният ден да кажеш „Обичам те“.",
        "Хармония и разбирателство вкъщи.",
        "Някой ще направи всичко възможно, за да те зарадва.",
        "Очаква те пътуване с любим човек.",
        "Здраве, силно като желязо.",
        "Билет за самолет до мечтана дестинация.",
        "Финансов бонус, който идва в точния момент.",
        "Екскурзия до красиво място сред природата.",
        "Всичко, което си пожелаеш днес, е на път към теб!"
    ];

    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let isDrawing = false;

    function toggleMusic() {
        if (music.paused) { music.play(); musicBtn.innerText = "🔊"; }
        else { music.pause(); musicBtn.innerText = "🔇"; }
    }

    function checkLimit() {
        const lastDate = localStorage.getItem('last_vending_scratch');
        const today = new Date().toDateString();
        if (lastDate === today) {
            document.getElementById('scratch-area').style.display = 'none';
            document.getElementById('limit-message').style.display = 'block';
            return true;
        }
        return false;
    }

    function initScratch() {
        if (checkLimit()) return;
        
        document.getElementById('shareSection').style.display = 'none';
        ctx.globalCompositeOperation = 'source-over';
        
        // Избор на късмет
        const textElem = document.getElementById('fortune-text');
        textElem.innerText = fortunes[Math.floor(Math.random() * fortunes.length)];

        // Слой за триене
        const grad = ctx.createLinearGradient(0, 0, 280, 180);
        grad.addColorStop(0, '#8d6e63'); grad.addColorStop(0.5, '#bcaaa4'); grad.addColorStop(1, '#5d4037');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 280, 180);
        
        ctx.font = 'bold 16px Montserrat'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
        ctx.fillText('ИЗТЪРКАЙ ТУК ЗА КЪСМЕТ ☕', 140, 95);
    }

    function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2); ctx.fill();

        document.getElementById('shareSection').style.display = 'block';
        localStorage.setItem('last_vending_scratch', new Date().toDateString());
    }

    function clearMemory() {
        localStorage.removeItem('last_vending_scratch');
        location.reload();
    }

    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('touchstart', (e) => { isDrawing = true; e.preventDefault(); });
    window.addEventListener('mouseup', () => isDrawing = false);
    window.addEventListener('touchend', () => isDrawing = false);
    canvas.addEventListener('mousemove', scratch);
    canvas.addEventListener('touchmove', (e) => { scratch(e); e.preventDefault(); });

    initScratch();
</script>

</body>
</html>
