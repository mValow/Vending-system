<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>V&M Vending – Твоят кафе-късмет</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at top, #3a2a25, #0f0b0a);
      color: #f5d9a6;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 40px rgba(255, 200, 120, 0.2);
      text-align: center;
      border: 1px solid rgba(255, 215, 150, 0.25);
    }

    .logo {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      margin-bottom: 25px;
    }

    .scratch {
      padding: 25px;
      border-radius: 20px;
      background: linear-gradient(145deg, #3b2a22, #1b1310);
      border: 1px dashed rgba(255,215,150,0.4);
      cursor: pointer;
      transition: 0.3s;
    }

    .scratch:hover {
      box-shadow: 0 0 20px rgba(255,215,150,0.3);
    }

    .scratch-text {
      font-size: 18px;
      letter-spacing: 1px;
    }

    .fortune {
      margin-top: 20px;
      font-size: 20px;
      font-family: 'Playfair Display', serif;
      display: none;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      opacity: 0.8;
    }

    .socials {
      margin-top: 15px;
    }

    .socials a {
      margin: 0 8px;
      color: #f5d9a6;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">☕ V&M Vending</div>
    <div class="subtitle">Твоят кафе-късмет ✨</div>

    <div class="scratch" onclick="drawFortune()">
      <div class="scratch-text">ИЗТЪРКАЙ ТУК ☕</div>
    </div>

    <div id="fortune" class="fortune"></div>

    <div class="socials">
      <a href="#">Facebook</a>
      <a href="#">Viber</a>
    </div>

    <div class="footer">
      Проблем с машината? Пиши ни тук.<br/>
      С любов от V&M Vending ❤️
    </div>
  </div>

  <script>
    const fortunes = [
      "Днес ще ти върви повече, отколкото очакваш ☀️",
      "Едно кафе – една добра новина ☕",
      "Усмивката ти е най-големият ти късмет ✨",
      "Днес си по-близо до целта си, отколкото мислиш 🚀",
      "Малките паузи правят големите дни по-добри 🤎",
      "Очаква те нещо приятно съвсем скоро 😉"
    ];

    function drawFortune() {
      const fortuneBox = document.getElementById("fortune");
      const random = Math.floor(Math.random() * fortunes.length);
      fortuneBox.innerText = fortunes[random];
      fortuneBox.style.display = "block";
    }
  </script>

</body>
</html>
