<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V&M Vending – Кафе късмет</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  font-family: Arial, sans-serif;
}

/* MAIN POSTER */
.poster {
  width: 360px;
  height: 740px;
  background: url("bg.jpg") center/cover no-repeat;
  position: relative;
}

/* SCRATCH CLICK ZONE */
.scratch-zone {
  position: absolute;
  top: 330px;
  left: 40px;
  width: 280px;
  height: 170px;
  cursor: pointer;
}

/* FORTUNE OVERLAY */
.fortune {
  position: absolute;
  top: 330px;
  left: 40px;
  width: 280px;
  height: 170px;
  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  color: #f5d9a6;
  font-size: 18px;
  background: rgba(20, 14, 12, 0.75);
  border-radius: 20px;
  backdrop-filter: blur(6px);
}
</style>
</head>

<body>

<div class="poster">

  <!-- CLICK AREA -->
  <div class="scratch-zone" onclick="drawFortune()"></div>

  <!-- RESULT -->
  <div class="fortune" id="fortune"></div>

</div>

<script>
const fortunes = [
  "Днес късметът е на твоя страна ☕✨",
  "Едно кафе – една добра новина",
  "Понякога малката пауза променя целия ден",
  "Очаква те нещо хубаво съвсем скоро",
  "Това кафе беше точно навреме 🤎"
];

function drawFortune() {
  const box = document.getElementById("fortune");
  const random = Math.floor(Math.random() * fortunes.length);
  box.innerText = fortunes[random];
  box.style.display = "flex";
}
</script>

</body>
</html>
