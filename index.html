<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V&M Vending – Кафе късмет</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}

/* POSTER */
.poster {
  width: 360px;
  height: 740px;
  background: url("bg.jpg") center/cover no-repeat;
  position: relative;
}

/* SCRATCH AREA */
#scratchContainer {
  position: absolute;
  top: 330px;
  left: 40px;
  width: 280px;
  height: 170px;
  border-radius: 20px;
  overflow: hidden;
}

/* FORTUNE */
#fortune {
  position: absolute;
  inset: 0;
  background: rgba(20,14,12,0.75);
  color: #f5d9a6;
  font-size: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

/* CAMERA BUTTON */
.camera-btn {
  position: absolute;
  bottom: 165px;
  left: 50%;
  transform: translateX(-50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 2px dashed rgba(255,215,150,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  color: #f5d9a6;
}
</style>
</head>

<body>

<div class="poster">

  <div id="scratchContainer">
    <div id="fortune"></div>
    <canvas id="scratch" width="280" height="170"></canvas>
  </div>

  <div class="camera-btn" onclick="openCamera()">📸</div>

</div>

<audio id="scratchSound" src="scratch.mp3"></audio>

<script>
const fortunes = [
  "Днес късметът е на твоя страна ☕✨",
  "Едно кафе – една добра новина",
  "Понякога малката пауза променя целия ден",
  "Очаква те нещо хубаво съвсем скоро",
  "Това кафе беше точно навреме 🤎"
];

const fortuneEl = document.getElementById("fortune");
fortuneEl.innerText = fortunes[Math.floor(Math.random() * fortunes.length)];

const canvas = document.getElementById("scratch");
const ctx = canvas.getContext("2d");
const sound = document.getElementById("scratchSound");

ctx.fillStyle = "#3a2a23";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.globalCompositeOperation = "destination-out";

let scratching = false;

function scratch(e) {
  if (!scratching) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

  ctx.beginPath();
  ctx.arc(x, y, 18, 0, Math.PI * 2);
  ctx.fill();

  if (sound.paused) sound.play();
}

canvas.addEventListener("mousedown", () => scratching = true);
canvas.addEventListener("mouseup", () => { scratching = false; sound.pause(); });
canvas.addEventListener("mousemove", scratch);

canvas.addEventListener("touchstart", () => scratching = true);
canvas.addEventListener("touchend", () => { scratching = false; sound.pause(); });
canvas.addEventListener("touchmove", scratch);

function openCamera() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.capture = "environment";
  input.click();
}
</script>

</body>
</html>
