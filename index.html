<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твоето Късметче - Ежедневна доза усмивка</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e67e22; /* Оранжево като кафе/късметче */
            --bg-color: #fdf5e6;    /* Топъл кремав цвят */
        }

        body {
            font-family: 'Comfortaa', cursive;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #444;
        }

        .header {
            padding: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-bottom: 5px solid var(--primary-color);
            position: relative;
        }

        #fortune-text {
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-draw {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Comfortaa', sans-serif;
            font-weight: bold;
            margin-top: 30px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }

        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4);
        }

        .share-section {
            margin-top: 40px;
            display: none; /* Показва се само след теглене */
        }

        .share-btn {
            display: inline-block;
            margin: 5px;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            font-size: 0.9rem;
        }

        .fb { background-color: #3b5998; }
        .viber { background-color: #7360f2; }

        footer {
            padding: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="header">Късметче.bg</div>

    <div class="main-content">
        <div class="card">
            <div id="fortune-text">Кликни върху бутона отдолу, за да разбереш твоя късмет за днес!</div>
        </div>

        <button class="btn-draw" onclick="getFortune()">ИЗТЕГЛИ КЪСМЕТЧЕ</button>

        <div class="share-section" id="share-box">
            <p>Сподели своя късмет:</p>
            <a href="#" class="share-btn fb" onclick="shareFB()">Facebook</a>
            <a href="#" class="share-btn viber" id="viber-link">Viber</a>
        </div>
    </div>

    <footer>&copy; 2026 Твоят Сайт за Късметчета</footer>

<script>
    const fortunes = [
        "Ще получиш неочаквано обаждане, което ще те зарадва много! 📞",
        "Днес е денят, в който трябва да кажеш 'Да' на ново предизвикателство. ✨",
        "Любовта ти праща целувка. Огледай се! ❤️",
        "Работата ти ще бъде оценена подобаващо. Очаквай бонус! 💰",
        "Малко приключение ще направи деня ти незабравим. 🗺️",
        "Здравето и енергията ще бъдат твои верни спътници днес. 💪",
        "Ще намериш изгубена вещ или отдавна търсен отговор. 🔍"
    ];

    function getFortune() {
        const textElement = document.getElementById('fortune-text');
        const shareBox = document.getElementById('share-box');
        
        // Случаен избор
        const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
        
        // Визуална промяна
        textElement.style.opacity = 0;
        setTimeout(() => {
            textElement.innerText = randomFortune;
            textElement.style.opacity = 1;
            shareBox.style.display = 'block';
            
            // Настройка на линка за Viber
            const viberMsg = encodeURIComponent("Моят късмет за днес е: " + randomFortune);
            document.getElementById('viber-link').href = "viber://forward?text=" + viberMsg;
        }, 200);
    }

    function shareFB() {
        const url = window.location.href;
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, 'pop', 'width=600, height=400, scrollbars=no');
        return false;
    }
</script>

</body>
</html>
