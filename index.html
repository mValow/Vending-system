<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V&M Vending - Твоят Късмет</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD39A;
            --purple-light: #f3e5f5;
            --coffee-dark: #2b1d19;
            --glow-color: rgba(255, 211, 154, 0.6);
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            /* Лилаво-бял към тъмен градиент */
            background: radial-gradient(circle at top, #ffffff 0%, #e1bee7 30%, #2b1d19 100%);
            font-family: 'Montserrat', sans-serif;
            color: #4e342e; text-align: center;
            overflow-x: hidden;
        }

        /* --- GLOW ЕФЕКТИ --- */
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 40px 25px;
            border-radius: 40px;
            width: 90%; max-width: 360px;
            border: 2px solid var(--gold);
            /* Силен Glow ефект */
            box-shadow: 0 0 30px var(--glow-color), 0 10px 50px rgba(0,0,0,0.3);
            position: relative;
            z-index: 5;
        }

        /* Анимирана чаша с Glow */
        .coffee-wrapper {
            margin: 10px auto 20px;
            position: relative;
            width: 80px; height: 80px;
            filter: drop-shadow(0 0 10px var(--gold));
            animation: cupFloat 3s ease-in-out infinite;
        }

        @keyframes cupFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .coffee-logo {
            position: absolute; bottom: 10px; left: 15px;
            width: 50px; height: 35px;
            background: var(--coffee-dark);
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        .coffee-logo::after {
            content: ''; position: absolute; top: 5px; right: -12px;
            width: 12px; height: 18px; border: 4px solid var(--coffee-dark); border-radius: 50%;
        }

        .steam {
            width: 4px; height: 25px;
            background: linear-gradient(to top, var(--coffee-dark), transparent);
            border-radius: 10px; animation: steamRise 2s infinite ease-out; opacity: 0;
        }

        @keyframes steamRise {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

        h1 { font-family: 'Playfair Display', serif; font-style: italic; color: var(--coffee-dark); text-shadow: 0 0 8px rgba(0,0,0,0.1); }

        #scratch-container {
            position: relative; width: 280px; height: 180px; margin: 0 auto;
            border-radius: 20px; overflow: hidden; background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 10; cursor: crosshair; touch-action: none; }

        /* --- ФОРМА ЗА СИГНАЛ (MODAL) --- */
        #reportModal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; margin: 15% auto; padding: 30px;
            border-radius: 30px; width: 80%; max-width: 320px; text-align: left;
        }
        .modal-content textarea {
            width: 100%; height: 100px; border-radius: 15px; border: 1px solid #ddd;
            padding: 10px; font-family: inherit; margin: 10px 0;
        }
        .send-btn {
            background: var(--coffee-dark); color: white; border: none;
            padding: 10px 20px; border-radius: 20px; cursor: pointer; width: 100%;
        }

        .report-btn { 
            display: inline-block; margin-top: 25px; color: #7b1fa2; 
            font-size: 0.8rem; text-decoration: underline; cursor: pointer; font-weight: 600;
        }
        
        .music-control { 
            position: absolute; top: 15px; right: 15px; background: white;
            border: 1px solid var(--gold); border-radius: 50%; width: 35px; height: 35px; cursor: pointer;
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-thejazzpiano.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <button class="music-control" onclick="toggleMusic()" id="musicBtn">🔇</button>
    
    <div class="coffee-wrapper">
        <div style="display:flex; gap: 8px; position:absolute; top:-20px; left:25px;">
            <div class="steam" style="animation-delay:0s"></div>
            <div class="steam" style="animation-delay:0.4s"></div>
            <div class="steam" style="animation-delay:0.8s"></div>
        </div>
        <div class="coffee-logo"></div>
    </div>
    
    <div style="font-family: 'Comfortaa'; letter-spacing: 2px; font-size: 0.8rem; color: #7b1fa2;">V&M VENDING</div>
    
    <div id="scratch-area">
        <h1>Твоят кафе-късмет ✨</h1>
        <div id="scratch-container">
            <div id="fortune-overlay" style="display:flex; align-items:center; justify-content:center; height:100%; padding: 20px; color:#2b1d19; font-weight:600;">
                <span id="fortune-text"></span>
            </div>
            <canvas id="scratch-canvas" width="280" height="180"></canvas>
        </div>
    </div>

    <div id="limit-message" style="display:none; padding: 20px;">
        <h2 style="color: #7b1fa2;">Един късмет на ден! ☕</h2>
        <p>Върни се утре за нова доза вдъхновение.</p>
    </div>
    
    <div class="report-btn" onclick="openModal()">🆘 Проблем с машина? Сигнализирай тук</div>
</div>

<div id="reportModal">
    <div class="modal-content">
        <h3>Сигнал за проблем</h3>
        <p style="font-size: 0.8rem;">Опишете проблема (номер на машина, адрес или повреда):</p>
        <textarea id="reportText" placeholder="Напишете вашето съобщение тук..."></textarea>
        <button class="send-btn" onclick="sendReport()">Изпрати Сигнал</button>
        <button onclick="closeModal()" style="background:none; border:none; color:grey; width:100%; margin-top:10px; cursor:pointer;">Отказ</button>
    </div>
</div>

<script>
    const fortunes = [
        "Твоят потенциал е безкраен – започни днес!",
        "Днес кафето ще ти даде суперсили!",
        "Очаква те усмивка от непознат.",
        "Късметът е на твоя страна, действай смело!",
        "Днес е денят на голямата печалба!",
        "Любовта те чака зад ъгъла.",
        "Твоето ниво на готиност днес е извън скалата!",
        "Всичко ще се нареди само, докато си пиеш кафето."
    ];

    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let isDrawing = false;

    function toggleMusic() {
        if (music.paused) { music.play(); musicBtn.innerText = "🔊"; }
        else { music.pause(); musicBtn.innerText = "🔇"; }
    }

    // Проверка за лимит на ден
    function checkLimit() {
        const lastDate = localStorage.getItem('vending_date');
        const today = new Date().toDateString();
        if (lastDate === today) {
            document.getElementById('scratch-area').style.display = 'none';
            document.getElementById('limit-message').style.display = 'block';
        }
    }

    function initScratch() {
        checkLimit();
        document.getElementById('fortune-text').innerText = fortunes[Math.floor(Math.random() * fortunes.length)];
        
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(0, 0, 280, 180);
        ctx.font = 'bold 16px Montserrat';
        ctx.fillStyle = '#FFD39A';
        ctx.textAlign = 'center';
        ctx.fillText('ИЗТЪРКАЙ ТУК ☕', 140, 95);
    }

    function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath(); ctx.arc(x, y, 25, 0, Math.PI * 2); ctx.fill();

        // Записваме, че потребителят е използвал късмета си за днес
        localStorage.setItem('vending_date', new Date().toDateString());
    }

    // Функции за модала
    function openModal() { document.getElementById('reportModal').style.display = 'block'; }
    function closeModal() { document.getElementById('reportModal').style.display = 'none'; }
    
    function sendReport() {
        const text = document.getElementById('reportText').value;
        if (text.trim() === "") return alert("Моля, въведете описание!");
        
        // Пренасочване към Viber с готово съобщение
        const viberUrl = "viber://forward?text=" + encodeURIComponent("СИГНАЛ ЗА ПРОБЛЕМ (V&M Vending): " + text);
        window.location.href = viberUrl;
        closeModal();
    }

    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('touchstart', (e) => { isDrawing = true; e.preventDefault(); });
    window.addEventListener('mouseup', () => isDrawing = false);
    window.addEventListener('touchend', () => isDrawing = false);
    canvas.addEventListener('mousemove', scratch);
    canvas.addEventListener('touchmove', (e) => { scratch(e); e.preventDefault(); });

    initScratch();
</script>

</body>
</html>
